[build-system]
requires = ["setuptools >= 78", "setuptools-rust"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyalign"
version = "0.3.0"
authors = [
    {name = "Marcel Martin", email = "marcel.martin@scilifelab.se"}
]
description = "Fast banded edit distance"
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.11"

[project.urls]
"Homepage" = "https://github.com/marcelm/tinyalign/"

[[tool.setuptools-rust.ext-modules]]
target = "tinyalign"

[tool.cibuildwheel]
environment = {"CFLAGS"="-g0", "PATH"="$HOME/.cargo/bin:$PATH"}
test-command = ["cd {project}; pytest"]
test-requires = "pytest"

[tool.cibuildwheel.linux]
before-all = "curl -sSf https://sh.rustup.rs | sh -s -- -y"
